name: Build & Release APK

on:
  push:
    branches:
      - main
      - 0.4
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Cache auto-generated release keystore
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: instaeclipse-release-keystore-v1

      - name: Prepare or Auto-Generate Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          elif [ -f "release.keystore" ]; then
            echo "Reusing cached auto-generated release.keystore..."
          else
            echo "Auto-generating release.keystore..."
            KS_PASS="${KEYSTORE_PASSWORD:-instaeclipse}"
            K_ALIAS="${KEY_ALIAS:-instaeclipse}"
            K_PASS="${KEY_PASSWORD:-$KS_PASS}"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$K_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=InstaEclipse, OU=Dev, O=InstaEclipse, L=Unknown, S=Unknown, C=US"
          fi

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -n1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n1 | awk '{print $2}')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Signed Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'instaeclipse' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'instaeclipse' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'instaeclipse' }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-debug.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaEclipse-v${{ steps.version.outputs.version_name }}-release
          path: dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaEclipse-v${{ steps.version.outputs.version_name }}-debug
          path: dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-debug.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: InstaEclipse v${{ steps.version.outputs.version_name }}
          body: |
            Automated build of **InstaEclipse v${{ steps.version.outputs.version_name }}** (commit `${{ github.sha }}`).
            - **Release APK**: Signed with release keystore (`InstaEclipse-v${{ steps.version.outputs.version_name }}-release.apk`)
            - **Debug APK**: Debug build (`InstaEclipse-v${{ steps.version.outputs.version_name }}-debug.apk`)
          files: |
            dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-release.apk
            dist/InstaEclipse-v${{ steps.version.outputs.version_name }}-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
