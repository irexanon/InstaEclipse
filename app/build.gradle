plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 34

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 36
        versionCode 17
        versionName '0.7.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "${rootProject.projectDir}/release.keystore"
            def ksFile = file(ksPath)
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: "instaeclipse"
            def kAlias = System.getenv("KEY_ALIAS") ?: "instaeclipse"
            def kPass  = System.getenv("KEY_PASSWORD") ?: ksPass

            if (!ksFile.exists()) {
                try {
                    ksFile.parentFile?.mkdirs()
                    def javaHome = System.getProperty("java.home")
                    def keytoolBin = file("${javaHome}/bin/keytool").exists()
                            ? "${javaHome}/bin/keytool"
                            : "keytool"
                    def proc = [
                            keytoolBin, "-genkeypair", "-v",
                            "-keystore", ksFile.absolutePath,
                            "-alias", kAlias,
                            "-keyalg", "RSA",
                            "-keysize", "2048",
                            "-validity", "10000",
                            "-storepass", ksPass,
                            "-keypass", kPass,
                            "-dname", "CN=InstaEclipse, OU=Dev, O=InstaEclipse, L=Unknown, S=Unknown, C=US"
                    ].execute()
                    proc.waitFor()
                } catch (Exception ignored) {}
            }

            if (ksFile.exists()) {
                storeFile ksFile
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid

    // External library for shared preferences
    implementation libs.fileprefs
    // Testing dependencies
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    // Compile-only dependency
    compileOnly files('libs/api-82.jar')
}
